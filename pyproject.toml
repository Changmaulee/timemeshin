[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timemeshin"
version = "0.2.1"
description = "Deterministic Spatio-Temporal (S x T) Video-Scrubber Context Engine & Episodic Memory Substrate for AI Agents"
readme = "README.md"
authors = [
  { name = "Chandramouli", email = "moulee007@gmail.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "llm",
    "rag",
    "memory",
    "episodic-memory",
    "spatio-temporal",
    "time-travel",
    "state-machine",
    "causal-inference",
    "ai-agents",
    "antigravity"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/Changmaulee/timemeshin"
Repository = "https://github.com/Changmaulee/timemeshin"
"Bug Tracker" = "https://github.com/Changmaulee/timemeshin/issues"
