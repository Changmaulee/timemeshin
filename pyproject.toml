[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timemeshin"
version = "0.1.0"
description = "TimeMeshin: Deterministic Spatio-Temporal (S x T) Video-Scrubber Context Engine for LLM Retrieval"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Chandramouli & Antigravity Research"}
]
keywords = ["rag", "llm", "temporal-rag", "video-codec", "time-travel", "event-sourcing", "ai-memory", "timemeshin"]
dependencies = [
    "numpy>=1.20.0",
    "tabulate>=0.9.0",
    "pydantic>=1.10.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2.0"
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0"
]
dev = [
    "pytest>=7.0.0",
    "ipywidgets>=8.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0"
]
all = [
    "sentence-transformers>=2.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pypdf>=3.0.0"
]
