[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timemeshin"
version = "0.2.1"
description = "Deterministic Spatio-Temporal (S x T) Video-Scrubber Context Engine & Episodic Memory Substrate for AI Agents"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Chandramouli", email = "moulee007@gmail.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "rag",
    "llm",
    "memory",
    "episodic-memory",
    "spatio-temporal",
    "time-travel",
    "state-machine",
    "causal-inference",
    "ai-agents",
    "antigravity"
]
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "pydantic>=1.10.0"
]
dev = [
    "pytest>=7.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "pydantic>=1.10.0",
    "tabulate>=0.9.0"
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "pypdf>=3.0.0",
    "tabulate>=0.9.0",
    "pydantic>=1.10.0"
]

[project.urls]
Homepage = "https://github.com/Changmaulee/timemeshin"
Repository = "https://github.com/Changmaulee/timemeshin"
"Bug Tracker" = "https://github.com/Changmaulee/timemeshin/issues"

[tool.setuptools]
packages = ["timemeshin", "timemeshin.ingestion", "timemeshin.server"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.html"]
